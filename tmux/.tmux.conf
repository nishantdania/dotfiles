# Remap prefix to Control + a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Forward Pi's session-specific OSC title to Ghostty for pi-review.
set -g set-titles on

# Force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# quick pane cycling
unbind ^A
bind ^A select-pane -t :.+
